<!DOCTYPE html>
<html lang="de-DE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototyp: Warum wir fragen</title>
<style>
  :root {
    --bg: #f2f5f7; --card: #ffffff; --ink: #14212b; --muted: #455562; --line: #c9d3da;
    --accent: #0b5c8a; --accent-ink: #ffffff; --note-bg: #e8f1f7; --note-rule: #0b5c8a;
    --err: #a3201a; --err-bg: #fdecea; --banner-bg: #fff3c4; --banner-ink: #4a3800; --focus: #0b5c8a;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f171d; --card: #17222a; --ink: #e8eef2; --muted: #a9b8c3; --line: #33444f;
      --accent: #7cc4ee; --accent-ink: #0a1a24; --note-bg: #1b2d3a; --note-rule: #7cc4ee;
      --err: #ff9d94; --err-bg: #3a1c1a; --banner-bg: #4a3d12; --banner-ink: #ffe9a3; --focus: #7cc4ee;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f171d; --card: #17222a; --ink: #e8eef2; --muted: #a9b8c3; --line: #33444f;
    --accent: #7cc4ee; --accent-ink: #0a1a24; --note-bg: #1b2d3a; --note-rule: #7cc4ee;
    --err: #ff9d94; --err-bg: #3a1c1a; --banner-bg: #4a3d12; --banner-ink: #ffe9a3; --focus: #7cc4ee;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font: 400 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 30rem; margin: 0 auto; padding: 0 1rem 2rem; }
  .banner {
    background: var(--banner-bg); color: var(--banner-ink); font-size: 1rem; padding: .6rem 1rem;
    text-align: center; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 1.65rem; line-height: 1.2; margin: 1.5rem 0 .75rem; letter-spacing: -.01em; }
  h2 { font-size: 1.3rem; line-height: 1.25; margin: 0 0 .35rem; }
  h1:focus, h2:focus { outline: none; }
  p { margin: 0 0 1rem; }
  .lead { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem; margin: 1rem 0; }
  .hint { color: var(--muted); margin-bottom: .75rem; }

  .progress { margin: 1.25rem 0 .25rem; font-weight: 600; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); }

  .amt { display: flex; align-items: center; gap: .5rem; }
  input[type=text], select {
    font: inherit; font-size: 1.125rem; color: var(--ink); background: var(--bg);
    border: 2px solid var(--line); border-radius: 8px; padding: .65rem .75rem; min-height: 3rem; width: 100%;
  }
  .amt input { max-width: 14rem; }
  .amt .unit { font-size: 1.125rem; font-weight: 600; }
  input[aria-invalid="true"] { border-color: var(--err); }

  .err {
    color: var(--err); background: var(--err-bg); border-left: 4px solid var(--err);
    padding: .5rem .75rem; margin: .75rem 0 0; border-radius: 0 6px 6px 0;
  }
  .err:empty { display: none; }

  /* The note: always visible, always below the field and the error */
  .note {
    margin: 1rem 0 0; background: var(--note-bg); border-left: 4px solid var(--note-rule);
    border-radius: 0 8px 8px 0; padding: .8rem .9rem;
  }
  .note .tag { font-size: 1rem; color: var(--muted); margin: 0 0 .5rem; }
  .note dl { margin: 0; }
  .note dl > div { display: flex; flex-wrap: wrap; gap: .1rem .6rem; margin-bottom: .45rem; }
  .note dl > div:last-child { margin-bottom: 0; }
  .note dt { font-weight: 700; flex: 0 0 8.2rem; }
  .note dd { margin: 0; flex: 1 1 11rem; min-width: 0; }

  .row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.25rem; }
  button { font: inherit; font-size: 1.0625rem; cursor: pointer; min-height: 3rem; border-radius: 8px; padding: .6rem 1.2rem; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 2px solid var(--accent); font-weight: 700; }
  .btn.sec { background: transparent; color: var(--accent); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .linklike {
    background: none; border: none; color: var(--accent); text-decoration: underline; padding: .5rem .1rem;
    min-height: 2.75rem; font-weight: 500;
  }
  .linklike.attn { background: var(--note-bg); border-radius: 6px; padding: .5rem .75rem; font-weight: 700; outline: 2px solid var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .foot { margin-top: 1.5rem; border-top: 1px solid var(--line); padding-top: .5rem; }
  #status:not(:empty) { margin: .75rem 0 0; padding: .6rem .8rem; border: 1px dashed var(--muted); border-radius: 8px; background: var(--card); }

  .recap { list-style: none; margin: 0; padding: 0; }
  .recap li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .25rem .75rem; padding: .7rem 0; border-bottom: 1px solid var(--line); }
  .recap li:last-child { border-bottom: none; }
  .recap .k { flex: 1 1 12rem; min-width: 0; }
  .recap .v { font-weight: 700; }
  .opts { display: flex; flex-wrap: wrap; gap: .5rem .75rem; margin-top: .6rem; }

  details.dev { margin-top: 2rem; border: 1px solid var(--line); border-radius: 8px; padding: .5rem .9rem; background: var(--card); }
  details.dev summary { cursor: pointer; font-weight: 600; min-height: 2.5rem; display: flex; align-items: center; }
  .dev table { width: 100%; border-collapse: collapse; font-size: 1rem; margin: .5rem 0; display: block; overflow-x: auto; }
  .dev th, .dev td { text-align: left; padding: .3rem .5rem .3rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .ok { color: var(--accent); font-weight: 700; }
  .bad { color: var(--err); font-weight: 700; }
  .dev label { display: block; margin: .75rem 0 .3rem; font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) { .bar > span { transition: width .25s ease; } }
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<main class="wrap">
  <div id="app"></div>
  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
/* =========================================================================
   CONTENT OBJECT: all copy lives here, keyed by question ID and locale.
   Prototype notes are placeholders, not approved by legal or data protection.
   Nothing here states a fact about who sees data or how long it is kept.
   ========================================================================= */
const LOCALE = 'de-DE';
const QIDS = ['net_income', 'other_income', 'fixed_costs', 'income_doc'];

const CONTENT = {
  ui: {
    'de-DE': {
      banner: 'Prototyp-Text, nicht von Recht oder Datenschutz freigegeben',
      s1Title: 'Ratenplan einrichten',
      s1Intro: 'Als Nächstes fragen wir nach Ihrem Einkommen. Zu jeder Frage gibt es eine Begründung.',
      start: 'Start',
      agent: 'Mit der Beratung sprechen',
      agentStub: 'Beratungsweg: im Prototyp nicht gebaut. Es verlassen keine Daten diese Seite.',
      progress: (n, total) => `Frage ${n} von ${total}`,
      cont: 'Weiter', back: 'Zurück', backToRecap: 'Zurück zur Übersicht',
      errEmpty: 'Bitte einen Betrag eingeben, um fortzufahren.',
      errNaN: 'Bitte nur Zahlen eingeben, zum Beispiel 1250 oder 1250,50.',
      errNeg: 'Bitte keinen negativen Betrag eingeben.',
      blocked: 'Diese Frage können wir gerade nicht anzeigen.',
      why: 'Warum', how: 'Wie verwendet', who: 'Wer sieht es',
      tag: 'Platzhalter, nicht freigegeben',
      fileSelectLabel: 'Beispieldatei (simulierte Auswahl)',
      filePlaceholder: 'Bitte wählen',
      fileChoose: 'Datei auswählen',
      fileSamples: [
        { id: 'a', name: 'Lohnabrechnung_09.pdf', ext: 'pdf', mb: 0.4 },
        { id: 'b', name: 'Foto_Kontoauszug.jpg', ext: 'jpg', mb: 14 },
        { id: 'c', name: 'Notizen.docx', ext: 'docx', mb: 0.1 }
      ],
      errFileEmpty: 'Bitte eine Datei auswählen oder vorerst überspringen.',
      errFileType: 'Dieses Dateiformat wird nicht unterstützt. Möglich sind PDF, JPG und PNG.',
      errFileSize: 'Die Datei ist zu groß. Möglich sind bis zu 10 MB.',
      fileOther: 'Andere Datei wählen',
      fileSkip: 'Vorerst überspringen',
      fileChosen: (n) => `Ausgewählt: ${n}`,
      fileSkipped: 'Vorerst übersprungen',
      fileChange: 'Andere Datei wählen',
      s3Title: 'Danke, das passiert mit Ihren Angaben',
      recapHeading: 'Ihre Angaben',
      edit: 'Ändern',
      editFor: (l) => `${l} ändern`,
      none: 'Keine Angabe',
      next: 'Als Nächstes sehen Sie Ratenoptionen.',
      whoHeading: 'Wer sieht Ihre Angaben',
      disabledBtn: 'Weiter zu den Ratenoptionen',
      dev: {
        summary: 'Prototype checks (for reviewers)',
        intro: 'Content validation runs on load. A note that fails is not shown; the field is replaced by a message and the agent link.',
        col: ['Question', 'Words', 'Result'],
        pass: 'Pass', fail: 'Blocked',
        testLabel: 'Simulate a content failure',
        tests: { none: 'None', missing_q3: 'Missing note on question 3', long_q2: 'Overlong note on question 2', promise_q1: 'Outcome promise on question 1' },
        problems: { missing: 'note missing', part: 'empty part: ', words: 'over word limit', legal: 'legal-wording term: ', promise: 'outcome promise: ', status: 'status not set' }
      }
    }
  },

  questions: {
    net_income: {
      'de-DE': {
        label: 'Monatliches Nettoeinkommen',
        hint: 'Der Betrag, der nach Abzügen im Monat bei Ihnen ankommt.',
        kind: 'amount',
        note: {
          status: 'placeholder', statementId: 'PH-INC-01',
          why: 'Damit der Ratenplan zu Ihrem Alltag passen kann.',
          how: 'Die Angabe dient zur Berechnung der Ratenoptionen.',
          who: '[Platzhalter: Datenschutz ergänzt, wer die Angabe sieht.]'
        }
      }
    },
    other_income: {
      'de-DE': {
        label: 'Weitere regelmäßige Einnahmen',
        hint: 'Zum Beispiel Kindergeld oder ein Nebenjob. Gibt es keine, tragen Sie 0 ein.',
        kind: 'amount',
        note: {
          status: 'placeholder', statementId: 'PH-INC-02',
          why: 'Damit Ihr Einkommen vollständig erfasst ist.',
          how: 'Die Angabe wird zusammen mit dem Nettoeinkommen genutzt.',
          who: '[Platzhalter: Datenschutz ergänzt, wer die Angabe sieht.]'
        }
      }
    },
    fixed_costs: {
      'de-DE': {
        label: 'Monatliche Fixkosten',
        hint: 'Zum Beispiel Miete, Strom und Versicherungen zusammen.',
        kind: 'amount',
        note: {
          status: 'placeholder', statementId: 'PH-INC-03',
          why: 'Damit Ihre festen Ausgaben berücksichtigt werden können.',
          how: 'Die Angabe dient zur Berechnung der Ratenoptionen.',
          who: '[Platzhalter: Datenschutz ergänzt, wer die Angabe sieht.]'
        }
      }
    },
    income_doc: {
      'de-DE': {
        label: 'Einkommensnachweis',
        hint: 'Zum Beispiel eine Lohnabrechnung. Sie können diesen Schritt auch vorerst überspringen.',
        kind: 'upload',
        note: {
          status: 'placeholder', statementId: 'PH-INC-04',
          why: 'Ein Nachweis kann Ihre Angaben bestätigen.',
          how: 'Prototyp: Die Datei wird nicht hochgeladen. [Platzhalter für die echte Verwendung.]',
          who: '[Platzhalter: Datenschutz ergänzt, wer den Nachweis sieht.]'
        }
      }
    }
  },

  /* Lists below are prototype stand-ins for the lists agreed with compliance. */
  rules: {
    maxWords: 40,
    legalTerms: ['bonität', 'schufa', 'scoring', 'pfändung', 'verzug', 'inkasso', 'vollstreckung', 'mahnbescheid', 'rechtsverbindlich', 'haftung'],
    outcomePhrases: ['keine auswirkung', 'wirkt sich nicht aus', 'ohne folgen', 'garantiert', 'verspreche', 'kein nachteil', 'wird nicht negativ', 'genehmigt']
  }
};

/* ========================= helpers ========================= */
const t = CONTENT.ui[LOCALE];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });

/* ========================= single state object ========================= */
const S = {
  screen: 'entry',            // 'entry' | 'questions' | 'recap'  (the one value that switches screens)
  step: 0,
  answers: { net_income: null, other_income: null, fixed_costs: null, income_doc: null },
  drafts: {},
  errors: {},
  fileErr: null,              // 'empty' | 'type' | 'size' | null
  fromRecap: false,
  agentMsg: false,
  test: 'none'
};

/* ========================= content validation ========================= */
function getQ(id) {
  const q = JSON.parse(JSON.stringify(CONTENT.questions[id][LOCALE]));
  if (S.test === 'missing_q3' && id === 'fixed_costs') q.note = null;
  if (S.test === 'long_q2' && id === 'other_income') q.note.how += ' ' + 'und so weiter '.repeat(15);
  if (S.test === 'promise_q1' && id === 'net_income') q.note.why = 'Ihre Angabe hat keine Auswirkung auf den Plan.';
  return q;
}

function checkQ(id) {
  const q = getQ(id), p = t.dev.problems, problems = [];
  let words = 0;
  if (!q.note) { problems.push(p.missing); return { q, problems, words }; }
  ['why', 'how', 'who'].forEach((k) => { if (!q.note[k] || !q.note[k].trim()) problems.push(p.part + k); });
  if (!q.note.status || !q.note.statementId) problems.push(p.status);
  const text = ['why', 'how', 'who'].map((k) => q.note[k] || '').join(' ');
  words = text.trim().split(/\s+/).filter(Boolean).length;
  if (words > CONTENT.rules.maxWords) problems.push(p.words);
  const low = text.toLowerCase();
  CONTENT.rules.legalTerms.forEach((w) => { if (low.includes(w)) problems.push(p.legal + w); });
  CONTENT.rules.outcomePhrases.forEach((w) => { if (low.includes(w)) problems.push(p.promise + w); });
  return { q, problems, words };
}

/* ========================= amount parsing ========================= */
function parseAmt(raw) {
  const s = raw.trim().replace(/\s/g, '');
  if (!s) return { ok: false, err: 'empty' };
  if (/^-\d/.test(s)) return { ok: false, err: 'neg' };
  let n = null;
  if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s)) n = parseFloat(s.replace(/\./g, '').replace(',', '.'));
  else if (/^\d+(,\d{1,2})?$/.test(s)) n = parseFloat(s.replace(',', '.'));
  else if (/^\d+\.\d{1,2}$/.test(s)) n = parseFloat(s);
  if (n === null || !isFinite(n) || s.length > 14) return { ok: false, err: 'nan' };
  return { ok: true, v: n };
}
const errText = (e) => ({ empty: t.errEmpty, nan: t.errNaN, neg: t.errNeg }[e]);

/* ========================= views ========================= */
function agentBtn(extra) {
  return `<button type="button" class="linklike${extra ? ' attn' : ''}" data-action="agent" id="agent-link">${esc(t.agent)}</button>`;
}

function noteHTML(id, q) {
  const n = q.note;
  return `<aside class="note" id="note-${id}">
    <p class="tag">${esc(t.tag)} (${esc(n.statementId)})</p>
    <dl>
      <div><dt>${esc(t.why)}</dt><dd>${esc(n.why)}</dd></div>
      <div><dt>${esc(t.how)}</dt><dd>${esc(n.how)}</dd></div>
      <div><dt>${esc(t.who)}</dt><dd>${esc(n.who)}</dd></div>
    </dl>
  </aside>`;
}

function vEntry() {
  const rows = QIDS.map((id) => {
    const r = checkQ(id);
    const res = r.problems.length ? `<span class="bad">${esc(t.dev.fail)}</span><br>${esc(r.problems.join('; '))}` : `<span class="ok">${esc(t.dev.pass)}</span>`;
    return `<tr><td>${esc(id)}</td><td>${r.words || '-'}</td><td>${res}</td></tr>`;
  }).join('');
  const opts = Object.entries(t.dev.tests).map(([k, v]) => `<option value="${k}"${S.test === k ? ' selected' : ''}>${esc(v)}</option>`).join('');
  return `<section>
    <h1 tabindex="-1" data-focus>${esc(t.s1Title)}</h1>
    <p class="lead">${esc(t.s1Intro)}</p>
    <div class="row"><button type="button" class="btn" data-action="start">${esc(t.start)}</button></div>
    <div class="foot">${agentBtn()}</div>
    <details class="dev">
      <summary>${esc(t.dev.summary)}</summary>
      <p>${esc(t.dev.intro)}</p>
      <table><thead><tr>${t.dev.col.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>
      <label for="testsel">${esc(t.dev.testLabel)}</label>
      <select id="testsel" data-action="test">${opts}</select>
    </details>
  </section>`;
}

function vQuestion() {
  const id = QIDS[S.step];
  const { q, problems } = checkQ(id);
  const total = QIDS.length;
  const pct = ((S.step + 1) / total) * 100;
  const backLabel = S.fromRecap ? t.backToRecap : t.back;
  const head = `<p class="progress" id="prog">${esc(t.progress(S.step + 1, total))}</p>
    <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${S.step + 1}" aria-label="${esc(t.progress(S.step + 1, total))}"><span style="width:${pct}%"></span></div>`;

  if (problems.length) {
    return `<section>${head}
      <div class="card">
        <h2 tabindex="-1" data-focus>${esc(t.blocked)}</h2>
        <p>${agentBtn()}</p>
      </div>
      <div class="row">
        <button type="button" class="btn sec" data-action="back">${esc(backLabel)}</button>
        <button type="button" class="btn" disabled>${esc(t.cont)}</button>
      </div>
    </section>`;
  }

  let field = '', attn = false;
  if (q.kind === 'amount') {
    const saved = S.answers[id];
    const raw = S.drafts[id] !== undefined ? S.drafts[id] : (saved !== null ? String(saved).replace('.', ',') : '');
    const r = parseAmt(raw);
    attn = r.ok && r.v === 0;
    const err = S.errors[id] || '';
    field = `<h2 tabindex="-1" data-focus><label for="f-${id}">${esc(q.label)}</label></h2>
      <p class="hint" id="hint-${id}">${esc(q.hint)}</p>
      <div class="amt">
        <input type="text" inputmode="decimal" autocomplete="off" id="f-${id}" data-amt data-id="${id}" value="${esc(raw)}"
          aria-describedby="hint-${id} err-${id} note-${id}" aria-invalid="${err ? 'true' : 'false'}">
        <span class="unit" aria-hidden="true">€</span>
      </div>
      <p class="err" id="err-${id}">${esc(err)}</p>`;
  } else {
    const d = S.answers[id];
    let state = '';
    if (d && d.status === 'file') state = `<p><strong>${esc(t.fileChosen(d.name))}</strong></p><div class="opts"><button type="button" class="linklike" data-action="other">${esc(t.fileChange)}</button></div>`;
    else if (d && d.status === 'skipped') state = `<p><strong>${esc(t.fileSkipped)}</strong></p><div class="opts"><button type="button" class="linklike" data-action="other">${esc(t.fileChange)}</button></div>`;
    else {
      const o = t.fileSamples.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
      state = `<label for="f-${id}" class="hint" style="display:block">${esc(t.fileSelectLabel)}</label>
        <select id="f-${id}" aria-describedby="hint-${id} err-${id} note-${id}"><option value="">${esc(t.filePlaceholder)}</option>${o}</select>
        <div class="opts"><button type="button" class="btn sec" data-action="pick">${esc(t.fileChoose)}</button>
        <button type="button" class="linklike" data-action="skip">${esc(t.fileSkip)}</button></div>`;
    }
    const fe = S.fileErr ? { empty: t.errFileEmpty, type: t.errFileType, size: t.errFileSize }[S.fileErr] : '';
    const fopts = (S.fileErr === 'type' || S.fileErr === 'size')
      ? `<div class="opts"><button type="button" class="btn sec" data-action="other">${esc(t.fileOther)}</button>
         <button type="button" class="linklike" data-action="skip">${esc(t.fileSkip)}</button>${agentBtn()}</div>` : '';
    field = `<h2 tabindex="-1" data-focus>${esc(q.label)}</h2>
      <p class="hint" id="hint-${id}">${esc(q.hint)}</p>
      ${state}
      <div class="err" id="err-${id}" role="alert">${esc(fe)}</div>${fopts}`;
  }

  const showAgent = !(q.kind === 'upload' && (S.fileErr === 'type' || S.fileErr === 'size'));
  return `<section>${head}
    <div class="card">${field}${noteHTML(id, q)}</div>
    <div class="row">
      <button type="button" class="btn sec" data-action="back">${esc(backLabel)}</button>
      <button type="button" class="btn" data-action="cont">${esc(t.cont)}</button>
    </div>
    <div class="foot">${showAgent ? agentBtn(attn) : ''}</div>
  </section>`;
}

function answerText(id) {
  const a = S.answers[id];
  if (id === 'income_doc') return a ? (a.status === 'file' ? a.name : t.fileSkipped) : t.none;
  return a === null ? t.none : eur.format(a);
}

function vRecap() {
  const rows = QIDS.map((id, i) => `<li><span class="k">${esc(CONTENT.questions[id][LOCALE].label)}</span>
    <span class="v">${esc(answerText(id))}</span>
    <button type="button" class="linklike" data-action="edit" data-i="${i}" aria-label="${esc(t.editFor(CONTENT.questions[id][LOCALE].label))}">${esc(t.edit)}</button></li>`).join('');
  const w = checkQ('net_income');
  const who = w.problems.length ? `<p>${esc(t.blocked)}</p>` :
    `<p class="tag" style="color:var(--muted);margin-bottom:.3rem">${esc(t.tag)} (${esc(w.q.note.statementId)})</p><p style="margin:0">${esc(w.q.note.who)}</p>`;
  return `<section>
    <h1 tabindex="-1" data-focus>${esc(t.s3Title)}</h1>
    <div class="card"><h2>${esc(t.recapHeading)}</h2><ul class="recap">${rows}</ul></div>
    <div class="card"><h2>${esc(t.whoHeading)}</h2>${who}</div>
    <p>${esc(t.next)}</p>
    <div class="row"><button type="button" class="btn" disabled>${esc(t.disabledBtn)}</button></div>
    <div class="foot">${agentBtn()}</div>
  </section>`;
}

/* ========================= render ========================= */
const app = document.getElementById('app');
const statusEl = document.getElementById('status');
document.getElementById('banner').textContent = t.banner;

function render(focusSel, keepScroll) {
  app.innerHTML = S.screen === 'entry' ? vEntry() : S.screen === 'questions' ? vQuestion() : vRecap();
  statusEl.textContent = S.agentMsg ? t.agentStub : '';
  const el = app.querySelector(focusSel || '[data-focus]');
  if (el) el.focus({ preventScroll: true });
  if (!keepScroll && !focusSel) window.scrollTo(0, 0);
}
function go(screen) { S.screen = screen; S.agentMsg = false; S.fileErr = null; render(); }

/* ========================= events ========================= */
app.addEventListener('input', (e) => {
  const el = e.target;
  if (!el.matches('input[data-amt]')) return;
  const id = el.dataset.id, raw = el.value;
  S.drafts[id] = raw;
  const r = parseAmt(raw);
  const errEl = document.getElementById('err-' + id);
  if (r.ok) { S.answers[id] = r.v; S.errors[id] = ''; }
  else if (!raw.trim()) { S.answers[id] = null; S.errors[id] = ''; }
  else { S.errors[id] = errText(r.err); }   // invalid text is never saved
  errEl.textContent = S.errors[id];
  el.setAttribute('aria-invalid', S.errors[id] ? 'true' : 'false');
  const link = document.getElementById('agent-link');
  if (link) link.classList.toggle('attn', r.ok && r.v === 0);   // zero income: accepted, agent link highlighted, no message
});

app.addEventListener('change', (e) => {
  if (e.target.dataset.action === 'test') { S.test = e.target.value; render('#testsel', true); }
});

app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-action]');
  if (!b || b.tagName === 'SELECT') return;
  const a = b.dataset.action, id = QIDS[S.step];

  if (a === 'start') { S.step = 0; S.fromRecap = false; go('questions'); }
  else if (a === 'agent') { S.agentMsg = true; statusEl.textContent = t.agentStub; }
  else if (a === 'edit') { S.step = +b.dataset.i; S.fromRecap = true; go('questions'); }
  else if (a === 'back') {
    S.fileErr = null;
    if (S.fromRecap) { S.fromRecap = false; go('recap'); }
    else if (S.step > 0) { S.step--; S.agentMsg = false; render(); }
    else go('entry');
  }
  else if (a === 'cont') {
    const q = CONTENT.questions[id][LOCALE];
    if (q.kind === 'amount') {
      const input = document.getElementById('f-' + id);
      const r = parseAmt(input.value);
      if (!r.ok) {
        S.errors[id] = errText(r.err);
        document.getElementById('err-' + id).textContent = S.errors[id];
        input.setAttribute('aria-invalid', 'true');
        input.focus();
        return;
      }
      S.answers[id] = r.v; S.errors[id] = '';
    } else if (!S.answers[id]) {
      S.fileErr = 'empty'; render('#err-' + id, true); return;
    }
    if (S.fromRecap || S.step === QIDS.length - 1) { S.fromRecap = false; go('recap'); }
    else { S.step++; S.agentMsg = false; render(); }
  }
  else if (a === 'pick') {
    const sel = document.getElementById('f-' + id);
    const s = t.fileSamples.find((x) => x.id === sel.value);
    if (!s) { S.fileErr = 'empty'; render('#err-' + id, true); return; }
    if (!['pdf', 'jpg', 'png'].includes(s.ext)) { S.fileErr = 'type'; render('#err-' + id, true); return; }
    if (s.mb > 10) { S.fileErr = 'size'; render('#err-' + id, true); return; }
    S.answers[id] = { status: 'file', name: s.name }; S.fileErr = null; render('[data-focus]', true);
  }
  else if (a === 'skip') { S.answers[id] = { status: 'skipped' }; S.fileErr = null; render('[data-focus]', true); }
  else if (a === 'other') { S.answers[id] = null; S.fileErr = null; render('#f-' + id, true); }
});

/* Build-time style check: log results (no network involved) */
QIDS.forEach((id) => { const r = checkQ(id); console.info('[content check]', id, r.problems.length ? 'FAIL ' + r.problems.join('; ') : 'ok', r.words + ' words'); });
render();
</script>
</body>
